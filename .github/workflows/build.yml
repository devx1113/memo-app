name: Build Windows exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pyinstaller -r requirements.txt
      - run: python -m PyInstaller --noconfirm --clean MemoReminder.spec
      - uses: actions/upload-artifact@v4
        with:
          name: MemoReminder-exe
          path: dist/MemoReminder.exe
